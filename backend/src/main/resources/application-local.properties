# Explicitly activate local in IntelliJ or SPRING_PROFILES_ACTIVE.
# Optional private file is ignored by Git; use environment variables instead if preferred.
spring.config.import=classpath:./application-local-private.properties
spring.datasource.url=${VCRAFT_DB_URL:jdbc:postgresql://localhost:5432/vcraft_local}
spring.datasource.username=${VCRAFT_DB_USER:postgres}
spring.datasource.password=${VCRAFT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
