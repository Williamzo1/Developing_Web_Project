spring.config.import=optional:file:./application-local-private.properties,optional:file:./backend/application-local-private.properties

spring.datasource.url=${VCRAFT_DB_URL:jdbc:postgresql://localhost:5432/vcraft_local}
spring.datasource.username=${VCRAFT_DB_USER:postgres}
spring.datasource.password=${VCRAFT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:5173
media.storage-path=/tmp/vcraft-media
media.max-file-size-mb=5
media.max-files-per-request=10
cors.allowed-origins=http://localhost:5173
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
auth.session-hours=168
auth.otp-minutes=15

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
