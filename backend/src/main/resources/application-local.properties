# File riêng là TÙY CHỌN (đã gitignore). Thiếu file vẫn chạy được nếu đặt biến môi trường VCRAFT_DB_PASSWORD.
# Đặt ở thư mục backend/ (thư mục chạy) hoặc src/main/resources/. Mẫu: backend/application-local-private.properties.example
spring.config.import=optional:classpath:application-local-private.properties,optional:file:./application-local-private.properties

spring.datasource.url=${VCRAFT_DB_URL:jdbc:postgresql://localhost:5432/vcraft_local}
spring.datasource.username=${VCRAFT_DB_USER:postgres}
spring.datasource.password=${VCRAFT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
