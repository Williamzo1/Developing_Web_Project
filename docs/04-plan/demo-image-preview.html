<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ảnh demo vCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh lọc dính trên cùng, lưới ảnh chia theo từng hộ, xem ảnh lớn ở lớp phủ. Màu lấy từ men lam trên nền sứ. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --fg: #17202b;
  --muted: #5b6676;
  --line: #d9e0e8;
  --accent: #1f4fa3;
  --accent-soft: #e3ebf8;
  --sp: #1f6f4a; --qt: #8a5a12; --hs: #6b3fa0; --lang: #46586e;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1520; --surface: #172131; --fg: #e6ecf4; --muted: #9aa8bb; --line: #2a3a50;
    --accent: #8fb3f0; --accent-soft: #1e3150;
    --sp: #6fd0a0; --qt: #e8b35a; --hs: #c3a0f0; --lang: #a9b8cc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1520; --surface: #172131; --fg: #e6ecf4; --muted: #9aa8bb; --line: #2a3a50;
  --accent: #8fb3f0; --accent-soft: #1e3150;
  --sp: #6fd0a0; --qt: #e8b35a; --hs: #c3a0f0; --lang: #a9b8cc;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 12px; }
h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); }
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: grid; gap: 10px; padding-block: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-width: 64px; }
.chip { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.chip:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip .n { opacity: .7; font-variant-numeric: tabular-nums; margin-left: 4px; }
input[type="search"] { font: inherit; font-size: .9rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); width: min(320px, 100%); }
main { padding-block: 8px 48px; }
section.ws { margin-top: 28px; }
section.ws h2 { font-size: 1.15rem; margin: 0 0 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
section.ws h2 code { font-family: var(--mono); font-size: .8rem; color: var(--muted); font-weight: 400; }
section.ws .desc { margin: 0 0 12px; color: var(--muted); font-size: .9rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.thumb { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--accent-soft); border: 0; padding: 0; cursor: zoom-in; display: block; width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .err { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12px; font-size: .85rem; color: var(--muted); }
.meta { padding: 10px 12px 12px; display: grid; gap: 6px; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .75rem; }
.code { font-family: var(--mono); font-weight: 600; }
.pill { padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill.SP { color: var(--sp); } .pill.QT { color: var(--qt); } .pill.HS { color: var(--hs); } .pill.LANG { color: var(--lang); }
.type { color: var(--muted); }
.cap { margin: 0; font-size: .9rem; overflow-wrap: anywhere; }
.src { font-size: .8rem; color: var(--accent); text-decoration: none; }
.src:hover { text-decoration: underline; }
.empty { padding: 48px 0; text-align: center; color: var(--muted); }
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(6, 10, 16, .9); display: grid; grid-template-rows: 1fr auto; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; margin: auto; display: block; min-height: 0; }
.lb .stage { display: grid; min-height: 0; }
.lb-status { margin: auto; color: #e6ecf4; }
.lb .foot { color: #e6ecf4; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-top: 10px; }
.lb .foot a { color: #8fb3f0; }
.lb .btns { display: flex; gap: 8px; }
.lb button { font: inherit; background: #1e2a3c; color: #e6ecf4; border: 1px solid #3a4a62; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } .card:hover { border-color: var(--accent); } }
</style>
</head>

<header class="top"><div class="wrap">
  <h1>Ảnh demo vCraft — gốm Bát Tràng</h1>
  <p class="lede">Xem trước các ảnh ứng viên trong <code>docs/04-plan/demo-image-sources.md</code>. Ảnh tải trực tiếp từ Wikimedia Commons và Flickr, nên cần có mạng. Bấm vào ảnh để xem lớn, dùng phím ← → để chuyển ảnh.</p>
  <div class="stats" id="stats"></div>
</div></header>
<div class="bar"><div class="wrap">
  <div class="row" id="f-ws"><span class="lbl">Hộ</span></div>
  <div class="row" id="f-role"><span class="lbl">Vai trò</span></div>
  <div class="row" id="f-type"><span class="lbl">Loại SP</span></div>
  <div class="row"><span class="lbl">Tìm</span><input type="search" id="q" placeholder="Mã hoặc mô tả, ví dụ: ấm, O070"></div>
</div></div>
<main class="wrap" id="main"></main>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Xem ảnh lớn">
  <div class="stage"><img id="lb-img" alt=""><p id="lb-status" class="lb-status" hidden></p></div>
  <div class="foot"><span id="lb-cap"></span><span class="btns"><button id="lb-prev">← Trước</button><button id="lb-next">Sau →</button><button id="lb-close">Đóng (Esc)</button></span></div>
</div>

,"batch":2},{"code":"O030","ws":"xuong-gom-son-mai","role":"SP","type":3,"caption":"Đèn xông đục lỗ","page":"https://www.flickr.com/photos/36785965@N00/290215631","img":"https://live.staticflickr.com/100/290215631_6e775b301e_b.jpg","w":1024,"h":768,"batch":2},{"code":"O053","ws":"xuong-gom-son-mai","role":"SP","type":3,"caption":"Hộp, khay sơn mài","page":"https://www.flickr.com/photos/36785965@N00/740475804","img":"https://live.staticflickr.com/1066/740475804_7529e39563.jpg","w":375,"h":500,"batch":2},{"code":"O104","ws":"xuong-gom-son-mai","role":"SP","type":3,"caption":"Đĩa sơn mài khảm trứng","page":"https://www.flickr.com/photos/81989974@N00/2303523139","img":"https://live.staticflickr.com/2232/2303523139_07da5246ba_b.jpg","w":1024,"h":768,"batch":2},{"code":"O025","ws":"xuong-gom-son-mai","role":"QT","type":null,"caption":"Bình mộc trong xưởng","page":"https://www.flickr.com/photos/12720221@N08/39702792684","img":"https://live.staticflickr.com/4672/39702792684_b88044bacb_b.jpg","w":1024,"h":684,"batch":2},{"code":"O039","ws":"xuong-gom-son-mai","role":"QT","type":null,"caption":"Kệ khuôn trong xưởng","page":"https://www.flickr.com/photos/55769434@N05/32498326328","img":"https://live.staticflickr.com/4849/32498326328_4f44b62050_b.jpg","w":1024,"h":576,"batch":2},{"code":"O046","ws":"xuong-gom-son-mai","role":"QT","type":null,"caption":"Đóng sọt hàng","page":"https://www.flickr.com/photos/55769434@N05/44553161020","img":"https://live.staticflickr.com/4810/44553161020_0cbd290a72_b.jpg","w":1024,"h":683,"batch":2},{"code":"O118","ws":"xuong-gom-son-mai","role":"QT","type":null,"caption":"Khắc hoa văn lên bình mộc","page":"https://www.flickr.com/photos/62642921@N02/22837787799","img":"https://live.staticflickr.com/5680/22837787799_cce2e3ae2b_b.jpg","w":1024,"h":683,"batch":2},{"code":"O301","ws":"xuong-gom-son-mai","role":"QT","type":null,"caption":"Khảm vỏ trứng lên cốt","page":"https://www.flickr.com/photos/38735616@N07/4565956118","img":"https://live.staticflickr.com/4049/4565956118_f6b47dffa1.jpg","w":500,"h":281,"batch":2},{"code":"O303","ws":"xuong-gom-son-mai","role":"QT","type":null,"caption":"Rửa, mài bình sơn mài","page":"https://www.flickr.com/photos/84106241@N00/2125156948","img":"https://live.staticflickr.com/2383/2125156948_201ce17bc9_b.jpg","w":1024,"h":682,"batch":2},{"code":"O328","ws":"xuong-gom-son-mai","role":"QT","type":null,"caption":"Khuôn thạch cao phơi","page":"https://www.flickr.com/photos/87232391@N00/4256577604","img":"https://live.staticflickr.com/4068/4256577604_da5cdfdcfa.jpg","w":500,"h":375,"batch":2},{"code":"O008","ws":"lang","role":"LANG","type":null,"caption":"Sạp hàng ở chợ gốm","page":"https://www.flickr.com/photos/49269300@N05/4742649610","img":"https://live.staticflickr.com/4097/4742649610_baabc7e1f9_b.jpg","w":768,"h":1024,"batch":2},{"code":"O016","ws":"lang","role":"LANG","type":null,"caption":"Xe đạp chở bình lớn","page":"https://www.flickr.com/photos/94233847@N00/340830302","img":"https://live.staticflickr.com/146/340830302_379bec2657_b.jpg","w":768,"h":1024,"batch":2},{"code":"O021","ws":"lang","role":"LANG","type":null,"caption":"Xe thồ chở hàng qua phố","page":"https://www.flickr.com/photos/93125414@N00/304966812","img":"https://live.staticflickr.com/102/304966812_d209f80507.jpg","w":500,"h":267,"batch":2}];
const WS = [
  ["xuong-men-lam", "Xưởng Men Lam", "Gốm men lam (xanh–trắng): bình lọ, chậu, bát liễn vẽ lam."],
  ["xuong-dat-nung", "Xưởng Đất Nung", "Đất nung không men và vẽ màu: chum, vại, lọ, chậu, đồ chơi đất."],
  ["lo-men-ran", "Lò Men Rạn Cổ", "Men rạn, men nâu, dáng cổ: bình vôi, điếu, lư hương, chum rượu."],
  ["xuong-am-chen", "Xưởng Ấm Chén", "Đồ bàn ăn – uống trà: ấm, chén, cốc, bát, đĩa vẽ."],
  ["xuong-tuong-gom", "Xưởng Tượng Gốm", "Tượng, linh vật, lợn đất, chuông gió, đồ treo."],
  ["xuong-gom-son-mai", "Xưởng Gốm Sơn Mài", "Cốt gốm phủ sơn mài/sơn màu, hàng xuất khẩu."],
  ["lang", "Ảnh làng", "Ảnh chung cho trang chủ, bản đồ, tin tức."]
];
const ROLES = { SP: "Sản phẩm", HS: "Hồ sơ hộ", QT: "Công đoạn", LANG: "Ảnh làng" };
const TYPES = { 1: "Bình, lọ, chum, chậu", 2: "Ấm chén, cốc, bát đĩa", 3: "Tượng & trang trí" };
const state = { ws: "all", role: "all", type: "all", q: "" };
let visible = [], lbIndex = -1;

function store(k, v) { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) { return null; } return v; }
function chip(group, value, label, count) {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.dataset.group = group; b.dataset.value = value;
  b.innerHTML = label + (count != null ? `<span class="n">${count}</span>` : "");
  b.addEventListener("click", () => { state[group] = value; store("vcraft-preview-" + group, value); render(); });
  return b;
}
function buildFilters() {
  const ws = document.getElementById("f-ws");
  ws.append(chip("ws", "all", "Tất cả", DATA.length));
  WS.forEach(([s, n]) => ws.append(chip("ws", s, n, DATA.filter(d => d.ws === s).length)));
  const role = document.getElementById("f-role");
  role.append(chip("role", "all", "Tất cả"));
  Object.entries(ROLES).forEach(([k, n]) => role.append(chip("role", k, n, DATA.filter(d => d.role === k).length)));
  const type = document.getElementById("f-type");
  type.append(chip("type", "all", "Tất cả"));
  Object.entries(TYPES).forEach(([k, n]) => type.append(chip("type", k, n, DATA.filter(d => String(d.type) === k).length)));
  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  ["ws", "role", "type"].forEach(g => { const v = store("vcraft-preview-" + g); if (v) state[g] = v; });
}
function stats() {
  const sp = DATA.filter(d => d.role === "SP");
  const t = k => sp.filter(d => d.type === k).length;
  document.getElementById("stats").innerHTML =
    `<span><b>${DATA.length}</b> ảnh</span><span><b>${sp.length}</b> ảnh sản phẩm (loại 1: ${t(1)} · loại 2: ${t(2)} · loại 3: ${t(3)})</span>` +
    `<span>Đợt 1 (Commons): <b>${DATA.filter(d => d.batch === 1).length}</b> · Đợt 2 (Flickr): <b>${DATA.filter(d => d.batch === 2).length}</b></span>`;
}
function matches(d) {
  if (state.ws !== "all" && d.ws !== state.ws) return false;
  if (state.role !== "all" && d.role !== state.role) return false;
  if (state.type !== "all" && String(d.type) !== state.type) return false;
  if (state.q && !(d.code.toLowerCase().includes(state.q) || d.caption.toLowerCase().includes(state.q))) return false;
  return true;
}
function card(d, idx) {
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML = `
    <button class="thumb" type="button" aria-label="Xem lớn ${d.code}"><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="${d.caption}" src="${d.img}"></button>
    <div class="meta">
      <div class="tags"><span class="code">${d.code}</span><span class="pill ${d.role}">${ROLES[d.role]}</span>${d.type ? `<span class="type">Loại ${d.type}</span>` : ""}</div>
      <p class="cap">${d.caption}</p>
      <a class="src" href="${d.page}" target="_blank" rel="noopener">Trang ảnh gốc ↗</a>
    </div>`;
  const img = el.querySelector("img");
  img.addEventListener("error", () => { img.remove(); el.querySelector(".thumb").insertAdjacentHTML("beforeend", `<span class="err">Không tải được ảnh. Mở trang ảnh gốc để kiểm tra.</span>`); });
  el.querySelector(".thumb").addEventListener("click", () => openLb(idx));
  return el;
}
function render() {
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(state[c.dataset.group] === c.dataset.value)));
  const main = document.getElementById("main");
  main.innerHTML = "";
  visible = [];
  const order = { SP: 0, HS: 1, QT: 2, LANG: 3 };
  WS.forEach(([slug, name, desc]) => {
    const items = DATA.filter(d => d.ws === slug && matches(d)).sort((a, b) => order[a.role] - order[b.role] || (a.type || 0) - (b.type || 0) || a.code.localeCompare(b.code));
    if (!items.length) return;
    const sec = document.createElement("section");
    sec.className = "ws";
    sec.innerHTML = `<h2>${name}${slug !== "lang" ? ` <code>${slug}</code>` : ""} <span class="type">${items.length} ảnh</span></h2><p class="desc">${desc}</p>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    items.forEach(d => { grid.append(card(d, visible.length)); visible.push(d); });
    sec.append(grid);
    main.append(sec);
  });
  if (!visible.length) main.innerHTML = `<p class="empty">Không có ảnh nào khớp bộ lọc. Chọn "Tất cả" ở từng nhóm hoặc xóa ô tìm kiếm.</p>`;
}
const lb = document.getElementById("lb"), lbImg = document.getElementById("lb-img"), lbCap = document.getElementById("lb-cap"), lbStatus = document.getElementById("lb-status");
function openLb(i) {
  lbIndex = (i + visible.length) % visible.length;
  const d = visible[lbIndex];
  lbImg.hidden = true; lbStatus.textContent = "Đang tải ảnh…"; lbStatus.hidden = false;
  lbImg.onload = () => { lbImg.hidden = false; lbStatus.hidden = true; };
  lbImg.onerror = () => { lbStatus.textContent = "Không tải được ảnh. Mở trang ảnh gốc để kiểm tra."; };
  lbImg.src = d.img; lbImg.alt = d.caption;
  lbCap.innerHTML = `<b>${d.code}</b> · ${ROLES[d.role]} · ${d.caption} · <a href="${d.page}" target="_blank" rel="noopener">Trang ảnh gốc ↗</a> <span style="opacity:.7">(${lbIndex + 1}/${visible.length})</span>`;
  lb.hidden = false;
}
function closeLb() { lb.hidden = true; lbImg.removeAttribute("src"); }
document.getElementById("lb-prev").onclick = () => openLb(lbIndex - 1);
document.getElementById("lb-next").onclick = () => openLb(lbIndex + 1);
document.getElementById("lb-close").onclick = closeLb;
lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("stage")) closeLb(); });
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") openLb(lbIndex - 1);
  if (e.key === "ArrowRight") openLb(lbIndex + 1);
});
buildFilters(); stats(); render();
</script>
