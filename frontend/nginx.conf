server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Khớp spring.servlet.multipart.max-request-size=55MB của backend.
    # Mặc định của Nginx là 1 MB nên upload ảnh sẽ bị 413 trước khi tới backend.
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ảnh upload (FR-MEDIA-03) do backend phục vụ, backend tự đặt Cache-Control (1 năm, immutable).
    location /media/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Tệp do Vite băm tên nên có thể cache lâu.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
